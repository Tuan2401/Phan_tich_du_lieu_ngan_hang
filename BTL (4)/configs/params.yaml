# configs/params.yaml
paths:
  raw_data: "data/raw/bank.csv"
  processed_data: "data/processed/bank_cleaned.csv"
  models: "outputs/models/"
  reports: "outputs/reports/"

pipeline:
  random_seed: 42
  test_size: 0.2

mining:
  apriori_min_support: 0.05
  apriori_min_confidence: 0.5
  kmeans_clusters: 4

semi_supervised:
  labeled_ratio: 0.2  # Giữ lại 20% nhãn, giấu 80% để chạy self-training